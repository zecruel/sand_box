<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>COMTRADE</title>
  <link rel="stylesheet" type="text/css" href="/w2ui.min.css">
</head>
<body>
  <div id="top" style="background-color:darkseagreen;height:110px">
    <h3 style="text-align:center;">Read and plot COMTRADE (IEEE C37.111) files</h3>
    <h4 style="text-align:center;color:navy">by Zecruel - MIT licence - 2026</h4>
    <div style="display: flex;justify-content: center;align-items: center;">
      <label for="fileInput">Load files:</label>
      <input type="file" id="fileInput" accept=".cfg,.dat" multiple>
    </div>
  </div>
  <div id="recs" style="background-color:darkseagreen;height:180px"></div>
  <div style="position: relative; display: flex; height: 300px;">
    <div style="background-color:lightsteelblue;height:285px;width:50%;display:inline-block;">
      <div id="channels" style="height:250px"></div>
      <button class="w2ui-btn" onclick="plot_clear()">Clear</button>
      <button class="w2ui-btn" onclick="b_plot_channels()">Plot selected</button>
      <button class="w2ui-btn" onclick="b_composer()">To composer</button>
    </div>
    <div style="background-color:burlywood;height:285px;width:50%;display:inline-block;">
      <div id="composer" style="height:230px"></div>
      <div id="calc_msg" style="text-align:center;height:20px;color:red;font-size:12px;"></div>
      <button class="w2ui-btn" onclick="plot_clear()">Clear</button>
      <button class="w2ui-btn" onclick="b_plot_comp()">Plot comp</button>
    </div>
  </div>
  
  <div id="plot_out"><h3 style="text-align:center;">Output</h3></div>
  
  <div id="plot_container"></div>
  
  <script type="text/javascript" src="w2ui.min.js"></script>
  <script type="text/javascript" src="echarts.min.js"></script>
  <script src="fparser.umd.cjs"></script>
  <script>
    /* ----------------------------------------------------------------------
    Read and plot COMTRADE (IEEE C37.111) files
    Author: Ezequiel Rabelo de Aguiar - 05/2026 - https://github.com/zecruel/
    MIT licence
    
    Used libraries:
    
    * w2ui - https://github.com/vitmalina/w2ui - for GUI features (grid, buttons)
    * echarts - https://github.com/apache/echarts - for interactives plot charts
    * fparse - https://github.com/bylexus/fparse - for math expressions evaluation
    
    ------------------------------------------------------------------------- */
  
    // ------- global vars ---------------------
    
    let osc_idx = 0; // current file record index
    let ch_idx = 0; // current channel index
    let osc = {}; // main record object
    let comp_idx = 1; // id for composed calc
    
    // init plot chart object
    let plot_output = echarts.init(document.getElementById('plot_container'), 
      null, {renderer: 'canvas', useDirtyRect: false});
    window.addEventListener('resize', plot_output.resize);
    
    // GUI grid to list loaded record files and its parameters
    let recs_grid = new w2grid({
      name: 'recs',
      box: '#recs',
      style: 'border: 3px solid darkseagreen',
      header: 'Records',
      show: {
        header: true,
        selectColumn: true,
        lineNumbers: true
      },
      multiSelect: false, // allow only one file selection - current record
      columns: [
        { field: 'name', text: 'Name', size: '150px'}, // file name
        { field: 'id', text: 'Ident', size: '30%' }, // Record identification
        { field: 'an', text: 'An', size: '40px' }, // Total analog channels
        { field: 'dig', text: 'Dig', size: '40px' }, // total digital channels
        { field: 'smp', text: 'Samples', size: '70px' }, // total samples
        { field: 'start', text: 'Start', size: '120px' }, // date/time stamp of first sample
        { field: 'trig', text: 'Trigger', size: '70px' }, // trigger relative time
        { field: 'freq', text: 'Freq', size: '40px' }, // power system frequency
        { field: 'typ', text: 'Type', size: '70px' }, // type of DAT file (ascii, binary)
        { field: 'ver', text: 'Version', size: '70px' } // std version
      ],
      async onSelect(event) {
        // when one file is selected, update list of channels available
        await event.complete;
        osc_idx = 0;
        ch_idx = 0;
        const sel = this.getSelection();
        if (sel.length > 0) {
          osc_idx = sel[0];
        }
        populate_channels(osc_idx);
      }
    });
    
    // GUI grid to list available channels in record and its parameters
    let channels_grid = new w2grid({
      name: 'channels',
      box: '#channels',
      style: 'border: 3px solid lightsteelblue',
      header: 'Channels',
      show: {
        header: true,
        selectColumn: true,
        lineNumbers: true
      },
      multiSelect: true,
      columns: [
        { field: 'typ', text: 'T', size: '30px' }, // channel type (analog, digital)
        { field: 'un', text: 'Un', size: '40px' }, // analog unit
        { field: 'id', text: 'Ident', size: '120px' }, // channel id
        { field: 'cir', text: 'Cir', size: '80px' }, // circuit or component description
        { field: 'ph', text: 'Ph', size: '40px' }, // sequence or phase description
        { field: 'max', text: 'Max', size: '70px' }, // analog max value
        { field: 'min', text: 'Min', size: '70px' }  // analog min value
      ]
    });
    
    // GUI grid to compose single plot, allowing combine and calc
    let composer_grid = new w2grid({
      name: 'composer',
      box: '#composer',
      style: 'border: 3px solid burlywood',
      header: 'Composer',
      show: {
        header: true,
        toolbar: true,
        //footer: true,
        selectColumn: true,
        lineNumbers: true,
        toolbarReload: false,
        toolbarSearch: false,
        toolbarAdd: true,
        toolbarDelete: true,
        toolbarEdit: false
      },
      multiSelect: true,
      columns: [
        //{ field: 'color', text: 'Color', size: '60px', editable: { type: 'color' } },
        { field: 'calc', text: 'Calc', size: '120px', editable: { type: 'text' } }, // calc expression
        { field: 'tit', text: 'Title', size: '120px', editable: { type: 'text' } }, // title or description
        { field: 'scale', text: 'Scale', size: '90px', editable: { type: 'float'} }, // multiplier factor
        { field: 'ofs', text: 'Offset', size: '90px', editable: { type: 'float'} } // axis offset/bias
      ],
      toolbar: {
        onClick(event) {
          if (event.target == 'w2ui-add') {
            // add new calc
            this.owner.add({recid: comp_idx,
              'tit': 'Var ' + comp_idx,
              'scale': 1.0,
              'ofs': 0.0
              });
            this.owner.scrollIntoView(comp_idx);
            this.owner.editField(comp_idx, 0);
            comp_idx++; // update unique id
          }
        }
      },
      async onChange(event) { // when a calc is edited
        await event.complete;
        const recid = event.detail.recid;
        const rec = this.get(recid);
        const changes = rec.w2ui.changes;
        const message = document.getElementById("calc_msg");
        message.innerHTML = ""; // clear error message
        
        if (Object.keys(changes).includes('calc')){
          // when expression field is changed,
          // verify if expression is valid
          try {
            validade_calc_expr(changes.calc);
            // valid expression
            this.mergeChanges(); // accept changes
          } catch(err) {
            // invalid expression
            message.innerHTML = err.message; // show error message
            this.editField(recid, 0); // insists on editing
          }
        }
        else this.mergeChanges(); // accept changes in other fields
      }
    });
    
    //---------------------------------------- end of globals
    
    // clear all plots
    function plot_clear() {
      plot_output.clear();
      plot_output.resize({height: 50});
    }
    
    // plot selected channels, one chart per each
    function b_plot_channels () {
      const grids = [];
      const xAxes = [];
      const yAxes = [];
      const series = [];
      const titles = [];
      
      let top = 0; // chart vertical position
      let count = 0;
      
      const channels = channels_grid.getSelection(); // get selected channels indexes
      const rec = osc[osc_idx]; // get current record
      
      for (let i = 0; i < channels.length; i++){ // iterate over channels
        const ch = rec.channels[channels[i]-1]; // current channel
        if (ch.type === 'A') { // analog channel
          // sets up the data matrix for chart
          let data = [];
          for (let j = 0; j < rec.data.length; j++){
            // index '1' is always the time axis, in seconds
            data.push([rec.data[j][1], rec.data[j][ch.idx + 1]]);
          }
          // configure current chart parameters
          let name = ch.id + ':' + ch.c  + ':' + ch.ph; // complete channel description
          grids.push({top: top,left: 60, height: 200}); // big chart
          titles.push({top: top, left: 80, text: name,
            textStyle: { fontSize: 12, fontWeight: 'normal'}});
                // time axis
          xAxes.push({gridIndex: count, name: 't(s)', minorTick: {show: true}, minorSplitLine: {show: true}});
                // y axis - show channel unit and values marks
          yAxes.push({gridIndex: count, name: ch.un, minorTick: {show: true}, minorSplitLine: {show: true}});
          series.push({//name: name, 
            xAxisIndex: count, yAxisIndex: count,
                // mark trigger time
            markLine: {symbol: ['none', 'pin'],label: { show: false },
              data: [{ xAxis: rec.trig }]},
            type: 'line', showSymbol: false, clip: true, data: data}); // thin line
          // update parameters for next chart
          top += 260;
          count++;
        }
        else if (ch.type === 'D') { // digital channel
          // sets up the data matrix for chart
          let data = [];
          for (let j = 0; j < rec.data.length; j++){
            // index '1' is always the time axis, in seconds
            data.push([rec.data[j][1], rec.data[j][ch.idx + rec.channels_A + 1]]);
          }
          // configure current chart parameters
          let name = ch.id; // digital channel haves only id as description
          grids.push({top: top,left: 60, height: 30}); // small chart
          titles.push({top: top, left: 80, text: name,
            textStyle: { fontSize: 12, fontWeight: 'normal'}});
                // time axis
          xAxes.push({gridIndex: count, name: 't(s)', minorTick: {show: true}, minorSplitLine: {show: true}});
                // y axis - simplified
          yAxes.push({type: 'value', show: false, min: 0, max: 1, gridIndex: count});
          series.push({//name: name, 
            xAxisIndex: count, yAxisIndex: count,
                // mark trigger time
            markLine: {symbol: ['none', 'pin'],label: { show: false },
              data: [{ xAxis: rec.trig }]},
            type: 'line', areaStyle: {}, showSymbol: false, clip: true, data: data}); // area line
          // update parameters for next chart
          top += 60;
          count++;
        }
      }
      
      // make the whole chart object
      plot_output.clear();
      plot_output.resize({height: top + 50});
      let plot_option = { animation: false,
        grid: grids,
        xAxis: xAxes,
        yAxis: yAxes,
        series: series,
        title: titles,
            // zoom feature with slider - resize all charts simultaneously
        dataZoom: [{type: 'slider', xAxisIndex: 'all', top: top},{type: 'inside', xAxisIndex: 'all'}],
        tooltip: {trigger: 'axis'},
      };
      plot_output.setOption(plot_option);
    }
    
    // pass selected channels to composer plot dialog
    function b_composer(){
      const channels = channels_grid.getSelection(); // get selected channels indexes
      const rec = osc[osc_idx]; // get current record
      for (let i = 0; i < channels.length; i++){ // iterate over channels
        const ch = rec.channels[channels[i]-1]; // current channel
        // get channel description
        let name = ch.id
        if (ch.c) name += ':' + ch.c;
        if (ch.ph) name += ':' + ch.ph;
        // add to composer grid, with default parameters
        composer_grid.add({recid: comp_idx,
          'calc': 'v' + channels[i], // var name = 'v' + channel index
          'tit': name,
          'scale': 1.0,
          'ofs': 0.0
        });
        
        comp_idx++;
      }
        //composer_grid.scrollIntoView(comp_idx);
        //composer_grid.editField(comp_idx, 0)
    }
    
    // Validate math expression in composer
    // return the formula object and list of channels indexes to evaluate calc values
    function validade_calc_expr(expr){
      const tokens = expr.match(/v\d+/g); // look for variables
      if(!tokens) throw new Error("No variables");
      if(tokens.length < 1) throw new Error("No variables");
      // Verify if channels indexes are valid
      const var_idx = [];
      for (let i = 0; i < tokens.length; i++){
        const recid = parseInt(tokens[i].slice(1));
        const ch = channels_grid.get(recid);
        if (!ch) throw new Error("No Channel");
      }
      // validation OK
      
      // return the formula object and list of channels indexes
      // to evaluate calc values
      const fObj = new Formula(expr);
      vars = fObj.getVariables();
      for (let i = 0; i < vars.length; i++){
        const tok = vars[i].match(/v\d+/g);
        if (tok) var_idx.push(parseInt(tok[0].slice(1)));
      }
      return {formula: fObj, var_idx: var_idx };
    }
    
    // plot evaluated calc result and combinations from composer
    function b_plot_comp() {
      const series = [];
      
      let top = 0;  // chart vertical position
      let count = 0;
      
      const channels = composer_grid.getSelection(); // get composer elements indexes
      const rec = osc[osc_idx]; // current record
      for (let i = 0; i < channels.length; i++){ // iterate over elements
        const ch = composer_grid.get(channels[i]);
        try {
          let calc = validade_calc_expr(ch.calc); // get object to evaluate
          let v = {}
          let data = [];
          for (let j = 0; j < rec.data.length; j++){ // evaluate each value in time vector
            for (let k = 0; k < calc.var_idx.length; k++){ // get original value of each channel in var list
              let idx = calc.var_idx[k];
              v['v'+idx] = rec.data[j][idx+1]; 
            }
            let value = calc.formula.evaluate(v) * ch.scale + ch.ofs; // evaluate expr - apply scale and offset too
            data.push([rec.data[j][1], value]); // set up data mtrix for chart, with t and evaluated value
          }
          // finish current series config in chart
          let name = ch.tit;
          series.push({name: name, 
            //markLine: {symbol: ['none', 'pin'],label: { show: false },
            //  data: [{ xAxis: rec.trig }]},
            type: 'line', showSymbol: false, clip: true, data: data});
      
          
        } catch(err) { // error in evaluation
          console.log('fail', ch.calc, err.message);
          //message.innerHTML = err.message;
        }
        
      }
      
      // make the whole chart object
      plot_output.clear();
      plot_output.resize({height: 600});
      
      let plot_option = { animation: false,
        grid: {top: 0,left: 60, height: 500}, // huge chart
            // time axis
        xAxis: {name: 't(s)', minorTick: {show: true}, minorSplitLine: {show: true}},
            // y axis 
        yAxis: {name: 'y', minorTick: {show: true}, minorSplitLine: {show: true}},
        series: series, // combine all series in one chart
            // zoom feature in chart
        dataZoom: [{type: 'slider', xAxisIndex: 'all', top: 550},{type: 'inside', xAxisIndex: 'all'}],
        tooltip: {trigger: 'axis'},
      };
      plot_output.setOption(plot_option);
    }
    
    function getFileExtension(filename) {
      if (typeof filename !== 'string') {
          throw new TypeError('Filename must be a string');
      }

      // Extract the last part after the last dot
      const lastDotIndex = filename.lastIndexOf('.');

      // No dot found or dot is the first character (hidden files like .gitignore)
      if (lastDotIndex <= 0 || lastDotIndex === filename.length - 1) {
          return null;
      }

      return filename.slice(lastDotIndex + 1).toLowerCase();
    }
    
    function check_cfg(file) {
      return getFileExtension(file.name) === 'cfg'
    }
    function check_dat(file) {
      return getFileExtension(file.name) === 'dat'
    }
    
    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);

        reader.readAsText(file);
      });
    }
    
    function readFileAsBinary(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);

        reader.readAsArrayBuffer(file);
      });
    }
    
    async function read_osc(osc_obj) {
      const cfg_c = await readFileAsText(osc_obj.cfg_f);
      const lines = cfg_c.split(/\r?\n/); // Split file content into lines
      if (lines.length < 9) return; //error
        
      const ident = lines[0].split(','); // Read the first line
      if (ident.length < 2) return; //error
      osc_obj.id = ident[0];
      if (ident.length > 2) osc_obj.ver = parseInt(ident[2]);
      else osc_obj.ver = 1991;
      
      const channels = lines[1].split(',');
      if (channels.length < 3) return; //error
      let n_ch = parseInt(channels[0]);
      let n_chA = parseInt(channels[1]);
      let n_chD = parseInt(channels[2]);
      
      if (n_chA + n_chD != n_ch) return; //error
      if (lines.length < 8 + n_ch) return; //error
      
      osc_obj.channels_A = n_chA;
      osc_obj.channels_D = n_chD;
      osc_obj.channels = [];
      let line = 2;
      
      for (let i = 0; i < n_chA; i++){
        const ch_info = lines[line].split(',');
        ch = {type: "A"};
        ch.idx = parseInt(ch_info[0]);
        ch.id = ch_info[1];
        ch.ph = ch_info[2];
        ch.c = ch_info[3];
        ch.un = ch_info[4];
        ch.a = parseFloat(ch_info[5]);
        ch.b = parseFloat(ch_info[6]);
        ch.sk = parseInt(ch_info[7]);
        ch.min = parseInt(ch_info[8]);
        ch.max = parseInt(ch_info[9]);
        
        osc_obj.channels.push(ch);
        line++;
      }
      for (let i = 0; i < n_chD; i++){
        const ch_info = lines[line].split(',');
        ch = {type: "D"};
        ch.idx = parseInt(ch_info[0]);
        ch.id = ch_info[1];
        ch.st = parseInt(ch_info[ch_info.length - 1]);
        
        osc_obj.channels.push(ch);
        line++;
      }
      osc_obj.freq = parseInt(lines[line]);
      line++;
      osc_obj.n_sr = parseInt(lines[line]);
      line++;
      osc_obj.sr = [];
      osc_obj.n_smp = 0;
      for (let i = 0; i < osc_obj.n_sr; i++){
        const sr_info = lines[line].split(',');
        sr = {};
        sr.freq = parseFloat(sr_info[0]);
        sr.n_smp = parseInt(sr_info[1]);
        osc_obj.n_smp += sr.n_smp;
        osc_obj.sr.push(sr);
        line++;
      }
      const first = lines[line].split(',');
      osc_obj.first = {date: {}, time: {}};
      let date = first[0].split('/');
      osc_obj.first.date.d = parseInt(date[0]);
      osc_obj.first.date.m = parseInt(date[1]);
      osc_obj.first.date.y = parseInt(date[2]);
      let time = first[1].split(':');
      osc_obj.first.time.h = parseInt(time[0]);
      osc_obj.first.time.m = parseInt(time[1]);
      osc_obj.first.time.s = parseFloat(time[2]);
      line++;
      
      const first_d = new Date(osc_obj.first.date.y, 
        osc_obj.first.date.m,
        osc_obj.first.date.d,
        osc_obj.first.time.h,
        osc_obj.first.time.m,
        Math.trunc(osc_obj.first.time.s));
      
      const start = lines[line].split(',');
      osc_obj.start = {date: {}, time: {}};
      date = start[0].split('/');
      osc_obj.start.date.d = parseInt(date[0]);
      osc_obj.start.date.m = parseInt(date[1]);
      osc_obj.start.date.y = parseInt(date[2]);
      time = start[1].split(':');
      osc_obj.start.time.h = parseInt(time[0]);
      osc_obj.start.time.m = parseInt(time[1]);
      osc_obj.start.time.s = parseFloat(time[2]);
      line++;
      
      const start_d = new Date(osc_obj.start.date.y, 
        osc_obj.start.date.m,
        osc_obj.start.date.d,
        osc_obj.start.time.h,
        osc_obj.start.time.m,
        Math.trunc(osc_obj.start.time.s));
      const d_dif = (start_d - first_d)/1000;
      
      osc_obj.trig = Math.abs((osc_obj.start.time.s % 1) - (osc_obj.first.time.s % 1) + d_dif);
      //console.log(osc_obj.trig);
      
      let dat_type = lines[line].toLowerCase();
      osc_obj.dat_type = dat_type;
      
      if (dat_type === 'binary') {
        const chD_words = Math.ceil(n_chD/16);
        const bytes_rec = chD_words*2 + n_chA*2 + 8;
        const bytes_total = osc_obj.n_smp * bytes_rec;
        
        if(osc_obj.dat_f.size < bytes_total) return; //error
        
        const dat_c = await readFileAsBinary(osc_obj.dat_f);
        const view = new DataView(dat_c, 0);
        
        osc_obj.data = Array(osc_obj.n_smp).fill(NaN);
        let offset = 0;
        for(let i = 0; i < osc_obj.n_smp; i++){
          osc_obj.data[i] = Array(osc_obj.channels.length + 2).fill(NaN);
          for(let j = 0; j < chD_words + n_chA + 2; j++){
            if (j < 1) {
              osc_obj.data[i][j] = view.getInt32(offset, true); // index
              offset += 4;
            }
            else if (j < 2) {
              osc_obj.data[i][j] = view.getInt32(offset, true) * 1e-6; // convert microssecond to s
              offset += 4;
            }
            else{
              if (j < n_chA + 2 && osc_obj.channels[j-2].type == 'A'){
                osc_obj.data[i][j] = osc_obj.channels[j-2].a * view.getInt16(offset, true) + osc_obj.channels[j-2].b
                offset += 2;
              }
              else {
                let w_idx = (j - (n_chA + 2)) * 16;
                const word = view.getUint16(offset, true);
                let max_bit = 16;
                if (n_chD < 16) max_bit = n_chD;
                else if (w_idx + 16 > n_chD)
                  max_bit = n_chD - w_idx;
                
                w_idx += n_chA + 2;
                for (let bit = 0; bit < max_bit; bit++){
                  osc_obj.data[i][w_idx + bit] = (word >> bit) & 1;
                }
                offset += 2;
              }
            }
          }
        }
      }
      else if (dat_type === 'ascii') {
        const dat_c = await readFileAsText(osc_obj.dat_f);
        const lines = dat_c.split(/\r?\n/); // Split file content into lines
        if (lines.length < osc_obj.n_smp) console.log('error: '+ lines.length); //error
        
        osc_obj.data = Array(osc_obj.n_smp).fill(NaN);
        let max_lines = lines.length;
        if (lines.length > osc_obj.n_smp) max_lines = osc_obj.n_smp;
        for(let i = 0; i < max_lines; i++){
          osc_obj.data[i] = Array(osc_obj.channels.length + 2).fill(NaN);
          const rec = lines[i].split(',');
          let max_rec = rec.length;
          if (rec.length > osc_obj.channels.length + 2) max_rec = osc_obj.channels.length + 2;
          for(let j = 0; j < max_rec; j++){
            if (j < 1) osc_obj.data[i][j] = parseInt(rec[j]); // index
            else if (j < 2) osc_obj.data[i][j] = parseInt(rec[j]) * 1e-6; // convert microssecond to s
            else{
              if (osc_obj.channels[j-2].type == 'D')
                osc_obj.data[i][j] = parseInt(rec[j]);
              if (osc_obj.channels[j-2].type == 'A')
                osc_obj.data[i][j] = osc_obj.channels[j-2].a * parseInt(rec[j]) + osc_obj.channels[j-2].b;
            }
          }
        }
      }
    }
    
    function populate_channels(idx) {
      channels_grid.clear();
      composer_grid.clear();
      comp_idx = 1;
      const rec = osc[idx];
      
      if (!rec) return;
      
      const channels = rec.channels;
      
      const table = [];
      
      for (let i = 0; i < channels.length; i++) {
        if (channels[i].type == 'A'){
          let max = channels[i].a * channels[i].max + channels[i].b;
          let min = channels[i].a * channels[i].min + channels[i].b;
          table.push({
            'recid': i + 1, 'typ': channels[i].type, 'id': channels[i].id,
            'un': channels[i].un, 'cir': channels[i].c, 'ph': channels[i].ph,
            'max': max, 'min': min
          });
        } else if (channels[i].type == 'D'){
          table.push({
            'recid': i + 1, 'typ': channels[i].type, 'id': channels[i].id,
            'un': 'B', 'cir': '-', 'ph': '-', 'max': '1', 'min': '0'
          });
        }
      }
      channels_grid.add(table);
    }
  
    document.getElementById('fileInput').addEventListener('change', function(event) {
      channels_grid.clear();
      composer_grid.clear();
      comp_idx = 1;
      const cfgs = Array.from(event.target.files).filter(check_cfg)
      const dats = Array.from(event.target.files).filter(check_dat)
      
      // associate dat files and verify size
      osc = {};
      let recid = 0;
      for(const cfg of cfgs) {
        let dat_name = cfg.name.slice(0, cfg.name.lastIndexOf('.'));
        const dat = dats.find(look => look.name.slice(0, look.name.lastIndexOf('.')) === dat_name);
        if (dat) {
          if (dat.size < 50 * 1024 * 1024) { // 50 MB limit
            recid++;
            osc[recid] = {name: dat_name, cfg_f: cfg, dat_f: dat}
          }
        }
      }
      
      
      recs_grid.clear();
      
      for (let key = 1; key <= recid; key++) {
        let prom = read_osc(osc[key]);
        prom.then(
          function(value) { /* code if success */
            let start = osc[key].first.date.d + '/';
            start += osc[key].first.date.m + '/';
            start += osc[key].first.date.y + '-';
            start += osc[key].first.time.h + ':';
            start += osc[key].first.time.m + ':';
            start += osc[key].first.time.s;
            let trig = osc[key].start.date.d + '/';
            trig += osc[key].start.date.m + '/';
            trig += osc[key].start.date.y + '-';
            trig += osc[key].start.time.h + ':';
            trig += osc[key].start.time.m + ':';
            trig += osc[key].start.time.s;
            recs_grid.add([{
              'recid': key, 'name': osc[key].name, 'id': osc[key].id,
              'an': osc[key].channels_A, 'dig': osc[key].channels_D,
              'smp': osc[key].n_smp,
              'trig': osc[key].trig,
              'start': start,
              'freq': osc[key].freq,
              'typ': osc[key].dat_type,'ver': osc[key].ver
            }]);
          },
          function(value) { /* code if error */ }
        );
      
        //console.log(osc[key]);
          
      }
     
      
    });
    
  </script>
</body>
