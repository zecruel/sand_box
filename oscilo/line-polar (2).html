<body style="height: 100%; margin: 0">
  <div id="container" style="height: 100%"></div>

  <!-- Uncomment this line if you want to echarts-stat extension
  <script type="text/javascript" src="https://echarts.apache.org/en/js/vendors/echarts-stat/dist/ecStat.min.js"></script>
  -->
  <!-- Uncomment this line if you want to echarts-graph-modularity extension
  <script type="text/javascript" src="https://echarts.apache.org/en/js/vendors/echarts-graph-modularity/dist/echarts-graph-modularity.min.js"></script>

  -->

  <script type="text/javascript">
    var dom = document.getElementById('container');
    var myChart = echarts.init(dom, null, {
      renderer: 'canvas',
      useDirtyRect: false
    });
    var app = {};
    
    var option;

    option = {
  title: {
    text: 'Two Value-Axes in Polar'
  } ,
  legend: {
    //type: 'scroll',
    orient: 'vertical',
    right: 10,
    top: 20,
    bottom: 20,
    icon: 'rect'
    //data: ['va','vb']
  },
  polar: {},
  tooltip: {
    //trigger: 'axis',
    axisPointer: {
      type: 'cross'
    },
    formatter: function (params, ticket, callback) {
      const { seriesName, value, marker } = params;
      
      return marker + 
      '<b>' + echarts.format.encodeHTML(seriesName) + '</b><br />' +
       echarts.format.encodeHTML(value[0].toFixed(2) + '∠' + value[1].toFixed(1)); 
      
    }
  },
  angleAxis: {
    type: 'value',
    startAngle: 0,
    endAngle: 360,
    min: 0,
    max: 360
  },
  radiusAxis: {
    max: function (value) {return value.max * 1.001;}
  },
  series: [
    {
      coordinateSystem: 'polar',
      name: 'VA',
      type: 'line',
      lineStyle: { width: 5 },
      //showSymbol: false,
      symbolSize: 20,
      emphasis: {
        focus: 'series'
      },
      data: [{value:[0,0], symbol: 'none'},
        {value:[15,60], symbol: 'arrow', symbolRotate: -30 }]
    },
    {
      coordinateSystem: 'polar',
      name: 'VB',
      type: 'line',lineStyle: { width: 5 },
      //showSymbol: false,
      symbolSize: 20,
      data: [{value:[0,0], symbol: 'none'},
        {value:[10,90], symbol: 'arrow', symbolRotate: 0 }]
    }
  ]
};

    if (option && typeof option === 'object') {
      myChart.setOption(option);
    }

    window.addEventListener('resize', myChart.resize);
  </script>
