<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Arquivos TXT</title>

<style>
body{
    font-family:Arial;
    margin:20px;
}

#container{
    display:flex;
    gap:20px;
}

#lista{
    width:350px;
    border:1px solid #ccc;
    padding:10px;
}

#conteudo{
    flex:1;
    border:1px solid #ccc;
    padding:10px;
    white-space:pre-wrap;
    overflow:auto;
    height:600px;
}

.linha{
    display:flex;
    justify-content:space-between;
    padding:6px;
    border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<h2>Arquivos TXT</h2>

<div id="container">
    <div id="lista"></div>
    <div id="conteudo">Selecione um arquivo</div>
</div>

<script>

async function carregarArquivos()
{
    const resp =
        await fetch('/api/files');

    const files =
        await resp.json();

    const lista =
        document.getElementById('lista');

    lista.innerHTML = '';

    files.forEach(file =>
    {
        const row =
            document.createElement('div');

        row.className = 'linha';

        row.innerHTML =
            `
            <span>${file}</span>
            <span>
                <button onclick="ver('${file}')">
                    Ver
                </button>

                <button onclick="baixar('${file}')">
                    Download
                </button>
            </span>
            `;

        lista.appendChild(row);
    });
}

async function ver(nome)
{
    const texto =
        await fetch('/api/view/' +
        encodeURIComponent(nome));

    document.getElementById('conteudo')
        .textContent =
        await texto.text();
}

function baixar(nome)
{
    window.location =
        '/api/download/' +
        encodeURIComponent(nome);
}

async function carregarArquivoBinario() {
    const hexView = document.getElementById('conteudo');
    
    try {
        // 1. Faz a requisição configurando o tipo de resposta para 'arrayBuffer'
        const response = await fetch(FILE_URL);
        
        if (!response.ok) {
            throw new Error(`Erro no servidor: ${response.status} ${response.statusText}`);
        }

        const buffer = await response.arrayBuffer();
        
        // 2. Processa o buffer binário
        const view = new DataView(buffer);
        let hexOutput = '';
        let asciiOutput = '';
        let resultadoFinal = '';

        // Exibe em blocos de 16 bytes (padrão Hex Viewer)
        for (let i = 0; i < view.byteLength; i++) {
            const byte = view.getUint8(i);
            
            // Converte para hexadecimal com 2 dígitos
            hexOutput += byte.toString(16).padStart(2, '0') + ' ';
            
            // Cria uma representação ASCII legível (pontos para caracteres não imprimíveis)
            asciiOutput += (byte >= 32 && byte <= 126) ? String.fromCharCode(byte) : '.';

            // Quebra a linha a cada 16 bytes
            if ((i + 1) % 16 === 0 || i === view.byteLength - 1) {
                // Alinha o último bloco se ele não tiver 16 bytes
                if ((i + 1) % 16 !== 0) {
                    const espacosFaltando = 16 - ((i + 1) % 16);
                    hexOutput += '   '.repeat(espacosFaltando);
                }
                resultadoFinal += `${hexOutput} | ${asciiOutput}\n`;
                hexOutput = '';
                asciiOutput = '';
            }
        }

        hexView.textContent = resultadoFinal || '[Arquivo Vazio]';

    } catch (erro) {
        hexView.innerHTML = `<span style="color: #f48771;">Erro ao carregar: ${erro.message}</span>`;
    }
}
carregarArquivos();

</script>

</body>
</html>
