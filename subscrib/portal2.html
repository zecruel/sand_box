<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PB Toys</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI, Arial;
}

body{
  display:flex;
  height:100vh;
}

#menu{
  width:250px;
  background:#1f2937;
  color:white;
  overflow:auto;
}

#menu h2{
  padding:15px;
  border-bottom:1px solid #374151;
}

#appContainer{
  padding:10px;
}

#menu button{

  width:100%;
  margin-bottom:8px;
  padding:10px;

  border:none;
  border-radius:4px;

  background:#374151;
  color:white;
  cursor:pointer;
  text-align:left;
}

#menu button:hover{
  background:#4b5563;
}

#main{
  flex:1;
  display:flex;
  flex-direction:column;
}

#tabs{

  height:42px;
  display:flex;
  overflow-x:auto;

  background:#e5e7eb;
  border-bottom:1px solid #ccc;
}

.tab{

  display:flex;
  align-items:center;

  padding:10px;
  cursor:pointer;

  background:#d1d5db;
  margin-right:2px;
}

.tab.active{
  background:white;
  border-top:3px solid #2563eb;
}

.tab-close{
  margin-left:10px;
  color:red;
  font-weight:bold;
}

#content{
  flex:1;
  position:relative;
}

.frame{

  position:absolute;
  width:100%;
  height:100%;

  border:none;
  display:none;
}

.frame.active{
  display:block;
}

#toolbar{
  padding:8px;
  border-bottom:1px solid #ddd;
  background:#f9fafb;
}

</style>

</head>

<body>

<div id="menu">

  <h2>PB Toys</h2>

  <div id="appContainer"></div>

</div>

<div id="main">

  <div id="toolbar">

    <button onclick="clear_session()">
      Clear session
    </button>

  </div>

  <div id="tabs"></div>

  <div id="content"></div>

</div>

<script>

let counter = 0;

const STORAGE_TABS = "portal_tabs";
const STORAGE_ACTIVE = "portal_active";

function save_session(){
  const tabs = [];
  document
    .querySelectorAll(".frame")
    .forEach(frame=>{

      tabs.push({
        id: frame.id,
        title: frame.dataset.title,
        url: frame.src
      });

    });

  localStorage.setItem(STORAGE_TABS, JSON.stringify(tabs));

}

function save_actv_tab(id){
  localStorage.setItem(STORAGE_ACTIVE, id);
}

function activate_tab(id){
  document
    .querySelectorAll(".tab")
    .forEach(t=>t.classList.remove("active"));

  document
    .querySelectorAll(".frame")
    .forEach(f=>f.classList.remove("active"));

  const tab = document.getElementById("btn_" + id);
  const frame = document.getElementById(id);

  if(tab) tab.classList.add("active");
  if(frame) frame.classList.add("active");

  save_actv_tab(id);
}

function new_tab(title, url, sav_id){
  const id = sav_id || ("tab_" + (++counter));
  const exists = document.getElementById(id);

  if(exists){
    activate_tab(id);
    return;
  }

  const tab = document.createElement("div");

  tab.className = "tab";
  tab.id = "btn_" + id;

  tab.innerHTML = `
    <span>${title}</span>
    <span class="tab-close">×</span>
  `;

  tab.onclick = ()=> activate_tab(id);

  tab.querySelector(".tab-close")
    .onclick = (e)=>{

    e.stopPropagation();

    close_tab(id);
  };

  document
    .getElementById("tabs")
    .appendChild(tab);

  const frame = document.createElement("iframe");

  frame.className = "frame";
  frame.id = id;
  frame.src = url;

  frame.dataset.title = title;

  document
    .getElementById("content")
    .appendChild(frame);

  activate_tab(id);
  save_session();
}

function close_tab(id){
  const frame = document.getElementById(id);
  const tab = document.getElementById("btn_" + id);

  if(frame) frame.remove();
  if(tab) tab.remove();

  const last_tab = document.querySelector(".tab:last-child");

  if(last_tab){
    activate_tab(last_tab.id.replace("btn_",""));
  }

  save_session();
}

async function load_apps(){

  /*
  const resp = await fetch("apps.json");
  const apps = await resp.json();
  */
  
  const orig = window.location.origin + '/';
  const apps = [
    {id: 'sv_subscr', title: 'SV subscriber', url: orig + 'scl.html'},
    {id: 'sv_oscilo', title: 'SV oscilloscope', url: orig + 'emb_server.html'},
    {id: 'goose_subs', title: 'Goose  subscriber', url: orig + 'teste_plot.html'},
    {id: 'config_fr', title: 'Config FR', url: orig + 'line-polar.html'},
    {id: 'records', title: 'Fault records', url: orig + 'main.html'},
    {id: 'sv_gen', title: 'SV Generator', url: orig + 'form.html'}
  ];

  const container = document.getElementById("appContainer");

  apps.forEach(app=>{
    const btn = document.createElement("button");
    btn.textContent = app.title;
    btn.onclick = ()=>{
      new_tab(app.title, app.url, app.id);
    };
    container.appendChild(btn);
  });

}

function delay(milliseconds) {
  return new Promise(resolve => {
    setTimeout(resolve, milliseconds);
  });
}

async function restore_session(){
  const tabs = JSON.parse(localStorage.getItem(STORAGE_TABS)) || [];
  
  for (const tab of tabs){
    new_tab(tab.title, tab.url, tab.id);
    await delay(100);
  }

  const active = localStorage.getItem(STORAGE_ACTIVE);

  if(active){
    setTimeout(()=> activate_tab(active),100);
  }
}

function clear_session(){
  localStorage.removeItem(STORAGE_TABS);
  localStorage.removeItem(STORAGE_ACTIVE);
  location.reload();
}

load_apps().then(restore_session);

</script>

</body>
</html>
